<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VICEGRAM</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="VICEGRAM"><meta name="theme-color" content="#080808"><style>html,body{margin:0;height:100%;background:#080808;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}#message{position:fixed;bottom:11%;left:50%;transform:translateX(-50%);background:#1b101a;color:#fff;border:1px solid #fa1985;border-radius:12px;padding:10px 16px;font:13px Arial;display:none;z-index:20}</style></head><body><iframe id="app" title="VICEGRAM"></iframe><div id="message"></div><script>
const frame=document.getElementById('app');let current=0,history=[];
function show(n,info={}){if(n<1||n>10)return;if(current)history.push(current);current=n;frame.src='screen_'+String(n).padStart(2,'0')+'.html';frame.onload=()=>{if(n===7&&info.username)frame.contentWindow.postMessage({vicegramProfile:info.username},'*');if(n===10)frame.contentWindow.postMessage({vicegramPost:info},'*')}}
function toast(t){const el=document.getElementById('message');el.textContent=t;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',2200)}
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||!e.data?.vicegram)return;const d=e.data;if(d.action==='go')show(d.to,d.info);if(d.action==='notice')toast(d.text)});
show(1);setTimeout(()=>show(2),3000);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script></body></html>
