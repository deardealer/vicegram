<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>VICEGRAM — Single Post</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}.screen{position:relative;width:100vw;height:100dvh;max-width:calc(100dvh * 946 / 2048);margin:auto;overflow:hidden;background:#050505;container-type:inline-size}.art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.page{position:absolute;left:5.2%;right:5.2%;top:17%;bottom:10.8%;overflow-y:auto;scrollbar-width:none}.page::-webkit-scrollbar{display:none}h1{font-size:5.4cqw;margin:0 0 4cqw;letter-spacing:.025em}.back{display:inline-flex;align-items:center;gap:2cqw;border:0;background:transparent;color:#fff;font-size:3.5cqw;padding:0 0 4cqw;cursor:pointer}.back span{font-size:6cqw;color:#ff1987}.author{display:flex;align-items:center;gap:3cqw;width:100%;border:0;background:none;color:white;text-align:left;padding:0 0 3cqw;cursor:pointer}.avatar{width:10cqw;height:10cqw;border-radius:50%;border:2px solid #fa1985;display:grid;place-items:center;background:linear-gradient(145deg,#ff6e87,#31215d);font-size:5cqw}.author strong{display:block;font-size:3.9cqw}.author small{display:block;color:#aaa;font-size:3cqw;margin-top:1cqw}.picture{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:2cqw}.actions{display:flex;gap:4cqw;align-items:center;padding:3cqw 0;font-size:3.2cqw}.actions button{background:none;color:#fff;border:0;font-size:5cqw;cursor:pointer;padding:0}.actions button.liked{color:#ff1987}.actions .count{font-size:3.2cqw}.caption{font-size:3.5cqw;line-height:1.5;margin:1cqw 0}.caption strong{cursor:pointer}.location{color:#f71984;font-size:3cqw;margin:2cqw 0 4cqw}.comments{border-top:1px solid #383038;padding-top:3cqw}.comments h3{font-size:3.6cqw;margin:0 0 2cqw}.comments p{font-size:3cqw;line-height:1.4;color:#ccc}.comment-entry{display:flex;gap:1.5cqw;margin:3cqw 0}.comment-entry input{min-width:0;flex:1;background:#0a0a0a;border:1px solid #666;border-radius:2cqw;color:white;padding:2.2cqw;font-size:3.2cqw}.comment-entry button,.follow{background:#f71984;color:white;border:0;border-radius:2cqw;padding:2cqw 3cqw;font-size:3.2cqw;cursor:pointer}.profile{display:none}.profile.active{display:block}.post.hidden{display:none}.profile-head{display:flex;gap:3cqw;align-items:center;margin:4cqw 0}.profile-head .avatar{width:20cqw;height:20cqw;font-size:9cqw}.profile-head strong{font-size:4cqw}.profile-head p{font-size:3.2cqw;color:#aaa}.stats{display:flex;justify-content:space-around;padding:3cqw 0;border-top:1px solid #292129;border-bottom:1px solid #292129}.stats div{text-align:center}.stats b{font-size:4cqw}.stats small{display:block;font-size:3cqw;margin-top:1cqw}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:2cqw;margin-top:5cqw}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid #f71984;border-radius:2cqw;cursor:pointer}.gallery .placeholder{aspect-ratio:1;border:1px solid #f71984;border-radius:2cqw;background:linear-gradient(135deg,#1e3351,#fc548d)}.nav{position:absolute;left:2%;right:2%;bottom:1.4%;height:6.9%;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:transparent;cursor:pointer}
</style></head><body><main class="screen"><img class="art" alt="" src="assets/10_3954476472.png"><section class="page"><div id="post" class="post"><button class="back" id="backPost"><span>‹</span> BACK TO ALBUM</button><h1>SINGLE POST</h1><button class="author" id="author"><span class="avatar">🌴</span><span><strong>@ryan.305</strong><small>Vice City · Leonida</small></span></button><img class="picture" src="assets/10_9257356850.jpg" alt="Sunset road in Vice City"><div class="actions"><button id="like" aria-label="Like">♡</button><span id="likes" class="count">2.4K likes</span><button id="commentJump" aria-label="Comments">♧</button><span class="count" id="commentCount">2 comments</span></div><p class="caption"><strong id="captionAuthor">ryan.305</strong> Leonida hits different at night. 🌴</p><div class="location">⌖ Vice City · Community Album</div><div class="comments" id="comments"><h3>COMMENTS</h3><div id="commentList"><p><b>@miami.dreams</b> This view is unreal!</p><p><b>@leonidaboys</b> 🔥🔥🔥</p></div><div class="comment-entry"><input id="commentText" placeholder="Add a comment..." maxlength="200"><button id="send">POST</button></div></div></div><div id="profile" class="profile"><button class="back" id="backProfile"><span>‹</span> BACK TO POST</button><h1>USER PROFILE</h1><div class="profile-head"><div class="avatar">🌴</div><div><strong>@ryan.305</strong><p>My moments. My city.</p><p>Leonida, USA</p></div></div><div class="stats"><div><b>12</b><small>Shots</small></div><div><b>86</b><small>Followers</small></div><div><b>24</b><small>Following</small></div></div><div class="gallery"><img src="assets/10_9257356850.jpg" alt="Photo by ryan.305" id="galleryPost"><div class="placeholder"></div><div class="placeholder"></div><div class="placeholder"></div></div></div></section><nav class="nav" aria-label="Bottom navigation"><button aria-label="Feed"></button><button aria-label="Discover"></button><button aria-label="New Moment"></button><button aria-label="Leonida Map"></button><button aria-label="Profile"></button></nav><script>
const post=document.getElementById('post'),profile=document.getElementById('profile');function showProfile(){post.classList.add('hidden');profile.classList.add('active');document.querySelector('.page').scrollTop=0}function showPost(){post.classList.remove('hidden');profile.classList.remove('active');document.querySelector('.page').scrollTop=0}document.getElementById('author').onclick=showProfile;document.getElementById('captionAuthor').onclick=showProfile;document.getElementById('backProfile').onclick=showPost;document.getElementById('galleryPost').onclick=showPost;document.getElementById('backPost').onclick=()=>{alert('This is a standalone screen test. The album link will work after the screens are connected.')};let liked=false;document.getElementById('like').onclick=()=>{liked=!liked;document.getElementById('like').textContent=liked?'♥':'♡';document.getElementById('like').classList.toggle('liked',liked);document.getElementById('likes').textContent=liked?'2,401 likes':'2.4K likes'};document.getElementById('commentJump').onclick=()=>document.getElementById('comments').scrollIntoView({behavior:'smooth',block:'nearest'});let c=2;document.getElementById('send').onclick=()=>{let input=document.getElementById('commentText'),t=input.value.trim();if(!t)return;let p=document.createElement('p');let b=document.createElement('b');b.textContent='@you ';p.append(b,document.createTextNode(t));document.getElementById('commentList').append(p);input.value='';c++;document.getElementById('commentCount').textContent=c+' comments'};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>alert('Navigation will be connected in the combined app.'));
</script></main>
<script>
(function(){
const page=10;
function go(to,info){parent.postMessage({vicegram:true,action:'go',to,info:info||{}},'*')}
function notice(text){parent.postMessage({vicegram:true,action:'notice',text},'*')}
document.addEventListener('click',function(e){
 const nav=e.target.closest('.nav button');
 if(nav){e.stopImmediatePropagation();e.preventDefault();go([3,3,4,5,6][[...nav.parentElement.children].indexOf(nav)]);return}
 if(page===5){
   const photo=e.target.closest('.photo');
   if(photo){e.stopImmediatePropagation();e.preventDefault();go(10,{area:document.getElementById('areaTitle')?.textContent||'Vice City'});return}
 }
 if(page===6||page===7){
   const stat=e.target.closest('.stat');
   if(stat){let index=[...stat.parentElement.children].indexOf(stat);if(index===1||index===2){e.stopImmediatePropagation();go(index===1?8:9);return}}
   if(e.target.closest('#grid img,#gallery img')){e.stopImmediatePropagation();go(10);return}
 }
 if(page===8||page===9){
   const person=e.target.closest('.person');
   if(person){e.stopImmediatePropagation();go(7,{username:person.dataset.user});return}
 }
 if(page===10){
   if(e.target.closest('#author')){e.stopImmediatePropagation();go(7,{username:'ryan.305'});return}
   if(e.target.closest('#backPost')){e.stopImmediatePropagation();go(5);return}
 }
},true);
if(page===2){
 document.getElementById('submit')?.addEventListener('click',()=>{
   setTimeout(()=>{
     const msg=document.getElementById('msg')?.textContent||'';
     if(msg.startsWith('Form works.')){try{localStorage.setItem('vicegram_demo_user',document.getElementById('username')?.value||'vicecity_player')}catch(e){}go(3)}
   },0);
 });
}
if(page===4){
 document.getElementById('share')?.addEventListener('click',()=>{
  setTimeout(()=>{const posts=JSON.parse(localStorage.getItem('vicegram_posts')||'[]');if(posts.length){notice('Moment saved. Opening THE FEED.');go(3)}},70);
 });
}
if(page===3){
 const main=document.querySelector('.screen');
 const feed=document.createElement('div');
 feed.style.cssText='position:absolute;top:32%;left:6%;right:6%;bottom:11%;overflow:auto;color:white;font:14px Arial;scrollbar-width:none';
 main.appendChild(feed);
 let posts=[];try{posts=JSON.parse(localStorage.getItem('vicegram_posts')||'[]')}catch(e){}
 posts.forEach((p,i)=>{
   const item=document.createElement('div');item.style.cssText='margin-bottom:16px;cursor:pointer';
   const who=document.createElement('div');who.textContent='@'+(localStorage.getItem('vicegram_demo_user')||'vicecity_player');who.style.cssText='padding:9px 0;font-weight:bold';
   const img=document.createElement('img');img.src=p.image;img.style.cssText='width:100%;height:auto;max-height:320px;object-fit:contain;border-radius:8px';
   const caption=document.createElement('p');caption.textContent=p.caption||'';item.append(who,img,caption);
   item.addEventListener('click',()=>go(10,{postIndex:i}));feed.append(item)
 });
}
if(page===7){
 window.addEventListener('message',e=>{if(e.data?.vicegramProfile){const name=document.querySelector('.name');if(name)name.textContent='@'+e.data.vicegramProfile}});
}
if(page===10){
 window.addEventListener('message',e=>{if(e.data?.vicegramPost){const info=e.data.vicegramPost;if(info.area){const area=document.querySelector('.location');if(area)area.textContent=info.area}}});
}
})();
</script>

<script>
(function(){
function showUploadedPost(index){
 let posts=[];try{posts=JSON.parse(localStorage.getItem('vicegram_posts')||'[]')}catch(e){}
 const item=posts[index];if(!item||!item.image)return;
 window.vicegramActivePostIndex=index;
 window.vicegramActivePostKey='vicegram_post_comments_'+index;

 const username=localStorage.getItem('vicegram_demo_user')||'vicecity_player';
 const photo=document.querySelector('#post .picture');
 photo.src=item.image;photo.alt='Photo uploaded by '+username;
 document.querySelector('#author strong').textContent='@'+username;
 document.querySelector('#author small').textContent=(item.location||'Leonida')+' · Leonida';
 const caption=document.querySelector('#post .caption');
 caption.replaceChildren();
 const author=document.createElement('strong');author.id='captionAuthor';author.textContent=username;
 author.onclick=()=>parent.postMessage({vicegram:true,action:'go',to:6},'*');
 caption.append(author,document.createTextNode(' '+(item.caption||'')));
 document.querySelector('#post .location').textContent='⌖ '+(item.location||'Leonida');
 document.getElementById('likes').textContent='0 likes';
 const list=document.getElementById('commentList');list.replaceChildren();
 let saved=[];try{saved=JSON.parse(localStorage.getItem(window.vicegramActivePostKey)||'[]')}catch(e){}
 if(!Array.isArray(saved))saved=[];
 for(const entry of saved){const row=document.createElement('p'),who=document.createElement('b');who.textContent='@'+(entry.author||'you')+' ';row.append(who,document.createTextNode(entry.text||''));list.append(row)}
 document.getElementById('commentCount').textContent=saved.length+' comments';

 document.querySelector('#author').onclick=()=>parent.postMessage({vicegram:true,action:'go',to:6},'*');
 document.querySelector('#backPost').onclick=()=>parent.postMessage({vicegram:true,action:'go',to:3},'*');
 document.querySelector('#galleryPost').src=item.image;
}
window.addEventListener('message',e=>{
 if(e.data&&e.data.vicegramPost&&Number.isInteger(e.data.vicegramPost.postIndex))showUploadedPost(e.data.vicegramPost.postIndex);
});
})();
</script>

<script>
(function(){
 const send=document.getElementById('send'),input=document.getElementById('commentText');
 send.onclick=function(){
  const text=input.value.trim();if(!text)return;
  const key=window.vicegramActivePostKey||'vicegram_demo_post_comments';
  let entries=[];try{entries=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
  if(!Array.isArray(entries))entries=[];
  const author=localStorage.getItem('vicegram_demo_user')||'you';
  entries.push({author,text});
  try{localStorage.setItem(key,JSON.stringify(entries))}catch(e){alert('Unable to save comments in this browser.')} 
  const row=document.createElement('p'),who=document.createElement('b');who.textContent='@'+author+' ';row.append(who,document.createTextNode(text));document.getElementById('commentList').append(row);
  document.getElementById('commentCount').textContent=entries.length+' comments';input.value='';
 };
 input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send.click()}});
})();
</script>
</body></html>
