<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VICEGRAM — Sign Up</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;width:100%;height:100%;overflow:hidden} .screen{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#000;container-type:size} .art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none} .form{position:absolute;left:7.6%;right:7.6%;top:36.8%;bottom:15.7%;background:#000;display:flex;flex-direction:column;gap:0} .tabs{display:flex;height:12.1%;min-height:0;background:#242424;border-radius:2.8cqw;overflow:hidden;margin-bottom:5.3%}.tabs button{width:50%;background:#242424;border:0;color:#fff;font-size:4.3cqw;font-weight:700;cursor:pointer}.tabs button.active{background:#fb1b86;color:#000;border-radius:2.8cqw}.fields{display:flex;flex-direction:column;gap:2.7%;height:36.8%;min-height:0}.field{height:29%;display:flex;align-items:center;border:1.5px solid #dedede;border-radius:2.8cqw;padding:0 4%;gap:4%;min-height:0}.field svg{width:7%;height:58%;flex:none;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.field input{min-width:0;width:100%;border:0;outline:none;background:transparent;color:#fff;font-size:3.9cqw}.field input::placeholder{color:#a5a5a5}.eye{border:0;background:transparent;color:#fff;font-size:3.8cqw;cursor:pointer}.primary{height:11.7%;min-height:0;background:#fb1b86;color:white;border:0;border-radius:3.2cqw;font-size:4.2cqw;font-weight:700;cursor:pointer;margin-top:3.2%}.forgot{display:none;align-self:center;margin-top:5%;border:0;background:transparent;color:#fff;font-size:3.8cqw;text-decoration:underline;cursor:pointer}.forgot.visible{display:block}.msg{font-size:2.7cqw;color:#ff6baa;text-align:center;margin-top:2%;min-height:1em}.hidden{display:none!important}@media(min-aspect-ratio: 0.7){.screen{max-width:calc(100dvh * 709 / 1536);margin:auto}}
</style><style id="vicegram-pwa-viewport">html,body{margin:0!important;padding:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#050505!important}body{display:flex!important;align-items:stretch!important;justify-content:center!important}.screen,.stage{box-sizing:border-box!important;flex:0 0 auto!important;position:relative!important;width:calc(100vw - 12px)!important;max-width:calc(100vw - 12px)!important;height:100dvh!important;max-height:100dvh!important;min-height:0!important;margin:0 auto!important;overflow:hidden!important}@supports(height:100svh){.screen,.stage{height:100svh!important;max-height:100svh!important}}</style></head><body><main class="screen"><img class="art" alt="" src="assets/02_4120957551.png"><section class="form" aria-label="Registration"><div class="tabs"><button type="button" id="login">Log In</button><button type="button" id="signup" class="active">Sign Up</button></div><div class="fields"><label class="field" id="usernameField"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3z"/></svg><input id="username" placeholder="Username" autocomplete="username"></label><label class="field"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m3 7 9 7 9-7"/></svg><input id="email" type="email" placeholder="Email" autocomplete="email"></label><label class="field"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="12" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 15v3"/></svg><input id="password" type="password" placeholder="Password" autocomplete="new-password"><button class="eye" id="eye" type="button" aria-label="Show password">◉</button></label></div><button class="primary" id="submit" type="button">Create Account</button><button class="forgot" id="forgot" type="button">Forgot Password?</button><div class="msg" id="msg" aria-live="polite"></div></section></main><script>
let mode='signup';const $=id=>document.getElementById(id);function setMode(m){mode=m;$('signup').classList.toggle('active',m==='signup');$('login').classList.toggle('active',m==='login');$('usernameField').classList.toggle('hidden',m==='login');$('submit').textContent=m==='signup'?'Create Account':'Log In';$('password').autocomplete=m==='signup'?'new-password':'current-password';$('forgot').classList.toggle('visible',m==='login');$('msg').textContent=''}$('signup').onclick=()=>setMode('signup');$('login').onclick=()=>setMode('login');$('eye').onclick=()=>{let p=$('password');p.type=p.type==='password'?'text':'password'};$('submit').onclick=()=>{const u=$('username').value.trim(),e=$('email').value.trim(),p=$('password').value;if(mode==='signup'&&!u){$('msg').textContent='Enter your username';return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){$('msg').textContent='Enter a valid email';return}if(p.length<6){$('msg').textContent='Password must contain at least 6 characters';return}$('msg').textContent='Form works. Account service will be connected later.'};$('forgot').onclick=()=>{$('msg').textContent='Password recovery by email will be connected with authentication.'};
</script>
<script>
(function(){
const page=2;
function go(to,info){parent.postMessage({vicegram:true,action:'go',to,info:info||{}},'*')}
function notice(text){parent.postMessage({vicegram:true,action:'notice',text},'*')}
document.addEventListener('click',function(e){
 const nav=e.target.closest('.nav button');
 if(nav){e.stopImmediatePropagation();e.preventDefault();go([3,3,4,5,6][[...nav.parentElement.children].indexOf(nav)]);return}
 if(page===5){
   const photo=e.target.closest('.photo');
   if(photo){e.stopImmediatePropagation();e.preventDefault();go(10,{area:document.getElementById('areaTitle')?.textContent||'Vice City'});return}
 }
 if(page===6||page===7){
   const stat=e.target.closest('.stat');
   if(stat){let index=[...stat.parentElement.children].indexOf(stat);if(index===1||index===2){e.stopImmediatePropagation();go(index===1?8:9);return}}
   if(e.target.closest('#grid img,#gallery img')){e.stopImmediatePropagation();go(10);return}
 }
 if(page===8||page===9){
   const person=e.target.closest('.person');
   if(person){e.stopImmediatePropagation();go(7,{username:person.dataset.user});return}
 }
 if(page===10){
   if(e.target.closest('#author')){e.stopImmediatePropagation();go(7,{username:'ryan.305'});return}
   if(e.target.closest('#backPost')){e.stopImmediatePropagation();go(5);return}
 }
},true);
if(page===2){
 document.getElementById('submit')?.addEventListener('click',()=>{
   setTimeout(()=>{
     const msg=document.getElementById('msg')?.textContent||'';
     if(msg.startsWith('Form works.')){try{localStorage.setItem('vicegram_demo_user',document.getElementById('username')?.value||'vicecity_player')}catch(e){}go(3)}
   },0);
 });
}
if(page===4){
 document.getElementById('share')?.addEventListener('click',()=>{
  setTimeout(()=>{const posts=JSON.parse(localStorage.getItem('vicegram_posts')||'[]');if(posts.length){notice('Moment saved. Opening THE FEED.');go(3)}},70);
 });
}
if(page===3){
 const main=document.querySelector('.screen');
 const feed=document.createElement('div');
 feed.style.cssText='position:absolute;top:32%;left:6%;right:6%;bottom:11%;overflow:auto;color:white;font:14px Arial;scrollbar-width:none';
 main.appendChild(feed);
 let posts=[];try{posts=JSON.parse(localStorage.getItem('vicegram_posts')||'[]')}catch(e){}
 posts.forEach((p,i)=>{
   const item=document.createElement('div');item.style.cssText='margin-bottom:16px;cursor:pointer';
   const who=document.createElement('div');who.textContent='@'+(localStorage.getItem('vicegram_demo_user')||'vicecity_player');who.style.cssText='padding:9px 0;font-weight:bold';
   const img=document.createElement('img');img.src=p.image;img.style.cssText='width:100%;height:auto;max-height:320px;object-fit:contain;border-radius:8px';
   const caption=document.createElement('p');caption.textContent=p.caption||'';item.append(who,img,caption);
   item.addEventListener('click',()=>go(10,{postIndex:i}));feed.append(item)
 });
}
if(page===7){
 window.addEventListener('message',e=>{if(e.data?.vicegramProfile){const name=document.querySelector('.name');if(name)name.textContent='@'+e.data.vicegramProfile}});
}
if(page===10){
 window.addEventListener('message',e=>{if(e.data?.vicegramPost){const info=e.data.vicegramPost;if(info.area){const area=document.querySelector('.location');if(area)area.textContent=info.area}}});
}
})();
</script>
</body></html>
