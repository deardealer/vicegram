<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VICEGRAM — PROFILE review</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;font-family:Arial,Helvetica,sans-serif;color:#f7f3ef}.screen{width:100vw;height:100dvh;max-width:calc(100dvh * 946 / 2048);margin:auto;position:relative;overflow:hidden;background:#000;container-type:inline-size}.art{width:100%;height:100%;position:absolute;inset:0;pointer-events:none}.tap{position:absolute;border:0;background:transparent;cursor:pointer;padding:0}.avatar{left:6.8%;top:17.7%;width:16.7%;aspect-ratio:1;border-radius:50%;overflow:hidden}.avatar img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}.name{position:absolute;left:27.6%;top:19.25%;font-size:4.0cqw;font-weight:700;max-width:69%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bio{position:absolute;left:27.6%;top:21.7%;font-size:3.6cqw;color:#aaa;max-width:69%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.count{position:absolute;top:27.6%;font-weight:bold;font-size:4.2cqw;text-align:center;width:20%;line-height:1.15}.shots-count{left:9.7%}.crew-count{left:37.2%}.following-count{left:67.2%}.stat-label{position:absolute;top:30.5%;width:25%;text-align:center;font-size:3.4cqw;color:#f7f3ef}.stat-label.shots{left:7.2%}.stat-label.followers{left:34.7%}.stat-label.following{left:64.7%}.edit{left:5.2%;top:34.1%;width:47.5%;height:4.7%}.share{left:55.5%;top:34.1%;width:27.3%;height:4.7%}.grid{position:absolute;left:5.2%;right:5.2%;top:51.6%;bottom:12%;display:none;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:min-content;gap:2%;overflow-y:auto;padding-top:1%}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:2cqw}.nav{position:absolute;left:1.4%;right:1.4%;bottom:1.2%;height:7.3%;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:transparent;cursor:pointer}.modal{position:absolute;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:5%;z-index:5}.panel{width:100%;background:#0c090c;border:2px solid #fa1a85;border-radius:5cqw;padding:5%;display:flex;flex-direction:column;gap:3cqw}.panel h2{font-size:5cqw;margin:0 0 1cqw}.panel label{font-size:3cqw;color:#aaa}.panel input,.panel textarea{width:100%;border:1px solid #777;border-radius:2cqw;background:#000;color:white;padding:3cqw;font-size:3.4cqw}.panel textarea{resize:none;height:20cqw}.actions{display:flex;gap:2cqw}.actions button{flex:1;border:1px solid #777;background:#111;color:white;border-radius:3cqw;padding:3cqw;font-size:3.2cqw}.actions .save{background:#fa1a85;border-color:#fa1a85;font-weight:bold}.toast{position:absolute;left:10%;right:10%;bottom:12%;padding:3%;background:#21111a;border:1px solid #fa1a85;border-radius:3cqw;text-align:center;display:none;font-size:3cqw;z-index:6}

.stats{position:absolute;top:27.0%;left:8%;right:8%;height:5.2%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;gap:1%;pointer-events:none}

.stat strong{font-size:4.5cqw;font-weight:700;line-height:1.15}
.stat span{font-size:3.35cqw;line-height:1.2}
.identity{position:absolute;left:29%;top:17.7%;width:62%;height:6%;background:transparent;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:1cqw;padding-left:0}
.identity .name,.identity .bio{position:static;left:auto;top:auto;display:block;width:100%;max-width:100%;height:auto;max-height:2.5em;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:normal;line-height:1.25;font-size:3.7cqw}
.identity .bio{color:#aaa;font-size:3.4cqw}
.screen:after{content:"";position:absolute;inset:0;border:1.15cqw solid #fa1985;border-radius:9cqw;pointer-events:none;z-index:8}
.grid{top:45.5%;bottom:12%;background:transparent;overflow-y:auto;gap:2%;padding:0}


/* Single clean avatar ring and single empty-gallery border. */
.avatar{left:6.8%;top:17.7%;width:16.7%;aspect-ratio:1;border:3px solid #fa1985;border-radius:50%;background:#050505;overflow:hidden;z-index:2}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}

</style><style id="vicegram-pwa-viewport">html,body{margin:0!important;padding:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#050505!important}body{display:flex!important;align-items:stretch!important;justify-content:center!important}.screen,.stage{box-sizing:border-box!important;flex:0 0 auto!important;position:relative!important;width:calc(100vw - 12px)!important;max-width:calc(100vw - 12px)!important;height:100dvh!important;max-height:100dvh!important;min-height:0!important;margin:0 auto!important;overflow:hidden!important}@supports(height:100svh){.screen,.stage{height:100svh!important;max-height:100svh!important}}</style></head><body><main class="screen"><img class="art" alt="VICEGRAM profile original approved layout" src="assets/06_5082458268.png"><button class="tap avatar" id="avatarBtn" aria-label="Change avatar"><img id="avatarImage" style="display:none" alt="Your avatar"></button><div class="identity" id="identity" hidden><div class="name" id="nameText"></div><div class="bio" id="bioText"></div></div><div class="stats"><div class="stat"><strong id="shotsCount">0</strong><span>Shots</span></div><div class="stat"><strong>0</strong><span>Followers</span></div><div class="stat"><strong>0</strong><span>Following</span></div></div><button class="tap edit" id="editBtn" aria-label="Edit profile"></button><button class="tap share" id="shareBtn" aria-label="Share ID"></button><div class="grid" id="grid"></div><nav class="nav" aria-label="Bottom navigation"><button aria-label="Feed" data-page="THE FEED"></button><button aria-label="Discover" data-page="DISCOVER"></button><button aria-label="New Moment" data-page="NEW MOMENT"></button><button aria-label="Map" data-page="LEONIDA MAP"></button><button aria-label="Profile" data-page="PROFILE"></button></nav><div class="modal" id="modal"><form class="panel" id="form"><h2>EDIT PROFILE</h2><label>Username<input id="username" maxlength="25" required></label><label>Bio<textarea id="bio" maxlength="90"></textarea></label><label>Profile photo<input id="photo" type="file" accept="image/*"></label><div class="actions"><button type="button" id="cancel">CANCEL</button><button class="save" type="submit">SAVE</button></div></form></div><div class="toast" id="toast"></div></main><script>
const $=id=>document.getElementById(id);const key='vicegram_profile_test';let state={username:'vicecity_player',bio:'My moments. My city.',avatar:''};try{state={...state,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){};
function refresh(){ $('nameText').textContent='@'+state.username.replace(/^@/,'');$('bioText').textContent=state.bio||' ';$('identity').hidden=false;$('avatarImage').src=state.avatar||'';$('avatarImage').style.display=state.avatar?'block':'none';let posts=[];try{let raw=JSON.parse(localStorage.getItem('vicegram_posts')||'[]');if(Array.isArray(raw))posts=raw}catch(e){};$('shotsCount').textContent=posts.length;$('grid').innerHTML='';if(posts.length){$('grid').style.display='grid';posts.forEach(p=>{let src=p.image||p.photo||p.src||p.dataUrl;if(typeof src==='string' && /^(data:image\/|blob:)/.test(src)){let el=document.createElement('img');el.src=src;el.alt=p.caption||'Moment';$('grid').appendChild(el)}})}else $('grid').style.display='none'}refresh();
let toastTimer;function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2200)}
function openEdit(){ $('username').value=state.username;$('bio').value=state.bio;$('photo').value='';$('modal').style.display='flex'}$('editBtn').onclick=openEdit;$('avatarBtn').onclick=openEdit;$('cancel').onclick=()=>$('modal').style.display='none';$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').style.display='none'};
function makeAvatar(file){
 return new Promise((resolve,reject)=>{
  if(!file){resolve('');return}
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error('Cannot read selected image'));
  reader.onload=()=>{
   const img=new Image();
   img.onerror=()=>reject(new Error('Unsupported image format'));
   img.onload=()=>{
    try{
     const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;
     const ctx=canvas.getContext('2d');const side=Math.min(img.naturalWidth,img.naturalHeight);
     ctx.drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,256,256);
     resolve(canvas.toDataURL('image/jpeg',0.72));
    }catch(err){reject(err)}
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}
const saveButton=document.querySelector('.actions .save');
const saveStatus=document.createElement('div');saveStatus.id='saveStatus';saveStatus.setAttribute('role','status');
saveStatus.style.cssText='color:#fff;font-size:3.2cqw;min-height:4cqw;text-align:center';
$('form').appendChild(saveStatus);
async function saveProfile(){
 saveButton.disabled=true;saveButton.textContent='SAVING...';saveStatus.textContent='';
 try{
  const name=$('username').value.trim().replace(/^@/,'');
  if(!name){saveStatus.textContent='Enter a username';return}
  const updated={...state,username:name,bio:$('bio').value.trim()};
  const file=$('photo').files&&$('photo').files[0];
  if(file)updated.avatar=await makeAvatar(file);
  let persisted=false;
  try{
   localStorage.setItem(key,JSON.stringify(updated));
   persisted=JSON.parse(localStorage.getItem(key)||'{}').username===updated.username;
  }catch(err){}
  state=updated;refresh();
  if(!persisted){saveStatus.textContent='Saved for this session only. Browser storage is blocked.';toast('Browser storage is blocked');return}
  $('modal').style.display='none';toast('PROFILE SAVED');
 }catch(err){saveStatus.textContent='Could not save photo: '+(err.message||'unknown error');}
 finally{saveButton.disabled=false;saveButton.textContent='SAVE'}
}
saveButton.type='button';
saveButton.addEventListener('click',saveProfile);
$('form').addEventListener('submit',e=>{e.preventDefault();saveProfile()});
$('shareBtn').onclick=()=>{const id='@'+state.username; if(navigator.share){navigator.share({title:'VICEGRAM',text:id}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(id).then(()=>toast('ID copied: '+id)).catch(()=>toast(id))}else toast(id)};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{if(b.dataset.page!=='PROFILE')toast(b.dataset.page+' — available after screens are connected')});
</script>
<script>
(function(){
const page=6;
function go(to,info){parent.postMessage({vicegram:true,action:'go',to,info:info||{}},'*')}
function notice(text){parent.postMessage({vicegram:true,action:'notice',text},'*')}
document.addEventListener('click',function(e){
 const nav=e.target.closest('.nav button');
 if(nav){e.stopImmediatePropagation();e.preventDefault();go([3,3,4,5,6][[...nav.parentElement.children].indexOf(nav)]);return}
 if(page===5){
   const photo=e.target.closest('.photo');
   if(photo){e.stopImmediatePropagation();e.preventDefault();go(10,{area:document.getElementById('areaTitle')?.textContent||'Vice City'});return}
 }
 if(page===6||page===7){
   const stat=e.target.closest('.stat');
   if(stat){let index=[...stat.parentElement.children].indexOf(stat);if(index===1||index===2){e.stopImmediatePropagation();go(index===1?8:9);return}}
   if(e.target.closest('#grid img,#gallery img')){e.stopImmediatePropagation();go(10);return}
 }
 if(page===8||page===9){
   const person=e.target.closest('.person');
   if(person){e.stopImmediatePropagation();go(7,{username:person.dataset.user});return}
 }
 if(page===10){
   if(e.target.closest('#author')){e.stopImmediatePropagation();go(7,{username:'ryan.305'});return}
   if(e.target.closest('#backPost')){e.stopImmediatePropagation();go(5);return}
 }
},true);
if(page===2){
 document.getElementById('submit')?.addEventListener('click',()=>{
   setTimeout(()=>{
     const msg=document.getElementById('msg')?.textContent||'';
     if(msg.startsWith('Form works.')){try{localStorage.setItem('vicegram_demo_user',document.getElementById('username')?.value||'vicecity_player')}catch(e){}go(3)}
   },0);
 });
}
if(page===4){
 document.getElementById('share')?.addEventListener('click',()=>{
  setTimeout(()=>{const posts=JSON.parse(localStorage.getItem('vicegram_posts')||'[]');if(posts.length){notice('Moment saved. Opening THE FEED.');go(3)}},70);
 });
}
if(page===3){
 const main=document.querySelector('.screen');
 const feed=document.createElement('div');
 feed.style.cssText='position:absolute;top:32%;left:6%;right:6%;bottom:11%;overflow:auto;color:white;font:14px Arial;scrollbar-width:none';
 main.appendChild(feed);
 let posts=[];try{posts=JSON.parse(localStorage.getItem('vicegram_posts')||'[]')}catch(e){}
 posts.forEach((p,i)=>{
   const item=document.createElement('div');item.style.cssText='margin-bottom:16px;cursor:pointer';
   const who=document.createElement('div');who.textContent='@'+(localStorage.getItem('vicegram_demo_user')||'vicecity_player');who.style.cssText='padding:9px 0;font-weight:bold';
   const img=document.createElement('img');img.src=p.image;img.style.cssText='width:100%;height:auto;max-height:320px;object-fit:contain;border-radius:8px';
   const caption=document.createElement('p');caption.textContent=p.caption||'';item.append(who,img,caption);
   item.addEventListener('click',()=>go(10,{postIndex:i}));feed.append(item)
 });
}
if(page===7){
 window.addEventListener('message',e=>{if(e.data?.vicegramProfile){const name=document.querySelector('.name');if(name)name.textContent='@'+e.data.vicegramProfile}});
}
if(page===10){
 window.addEventListener('message',e=>{if(e.data?.vicegramPost){const info=e.data.vicegramPost;if(info.area){const area=document.querySelector('.location');if(area)area.textContent=info.area}}});
}
})();
</script>
</body></html>
